{% import "_macros.html" as m %}
<tr id="linha-categoria-{{ item.id }}" class="{{ 'linha--inativa' if not item.ativo }}">
  <td class="tabela__principal">{{ item.nome }}</td>
  <td>{{ m.badge_ativo(item.ativo) }}</td>
  <td class="tabela__acoes">
    {{ m.acoes_linha(
         url_for('cadastros.categorias_editar', categoria_id=item.id),
         url_for('cadastros.categorias_alternar', categoria_id=item.id),
         item.ativo) }}
  </td>
</tr>
